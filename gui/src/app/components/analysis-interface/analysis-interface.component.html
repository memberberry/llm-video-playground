<h2>Analysis Interface</h2>

<div class="controls">
  <div class="control-group">
    <label for="model">Model:</label>
    <select id="model" [(ngModel)]="selectedModel">
      <option *ngFor="let model of models" [value]="model">{{ model }}</option>
    </select>
  </div>
  <div class="control-group">
    <label for="output">Output:</label>
    <select id="output" [(ngModel)]="outputType">
      <option value="structured">Structured</option>
      <option value="text">Text</option>
    </select>
  </div>
</div>

<div class="prompt-area">
  <label for="prompt">Prompt:</label>
  <textarea id="prompt" [(ngModel)]="prompt" placeholder="Enter your prompt here..."></textarea>
</div>

<div class="prompt-area" *ngIf="outputType === 'structured'">
  <label for="jsonSchema">JSON Schema:</label>
  <textarea id="jsonSchema" [(ngModel)]="jsonSchemaInput" placeholder="Enter your JSON schema here..." rows="10"></textarea>
  <button class="format-json-btn" (click)="formatJsonInput()">Format JSON</button>
  <div *ngIf="jsonSchemaError" class="error-message">{{ jsonSchemaError }}</div>
</div>

<button class="send-btn" (click)="sendRequest()" [disabled]="loadingGemini">
  <span *ngIf="!loadingGemini">Send</span>
  <mat-spinner *ngIf="loadingGemini" diameter="20"></mat-spinner>
</button>

<div *ngIf="geminiError" class="error-message gemini-error">
  <p>{{ geminiError }}</p>
</div>

<div class="response-area">
  <label>Response:</label>
  <pre>{{ response | json }}</pre>
</div>
